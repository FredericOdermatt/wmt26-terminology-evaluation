[project]
name = "wmt26-terminology-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sacrebleu>=2.6.0",
    "stanza>=1.14.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wmt26_terminology*"]

[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I001", "I002", "ARG", "ANN", "PLR", "RUF", "C", "B", "UP"]
extend-select = ["PLC0415", "TID252"]
ignore = ["B008"]
preview = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
