services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  web:
    image: wmt26-web
    build:
      context: ../src/frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=3000

  backend:
    image: wmt26-backend
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      WMT26_PB_URL: http://pocketbase:8090
      WMT26_PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      WMT26_PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      WMT26_TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      WMT26_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WMT26_UNIFIED_DATA_DIR: /app/data/unified/private
    volumes:
      # Gold data is synced to the host separately and never baked into the image.
      - ../data:/app/data:ro

  pocketbase:
    image: wmt26-pocketbase
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Collection rules are superuser-only, so the exposed API serves no data;
    # the admin UI is protected by the superuser login.
    labels:
      - traefik.enable=true
      - traefik.http.routers.db.rule=Host(`${DB_DOMAIN:-db.wmt26.odermatt.dev}`)
      - traefik.http.routers.db.entrypoints=websecure
      - traefik.http.routers.db.tls.certresolver=letsencrypt
      - traefik.http.services.db.loadbalancer.server.port=8090

volumes:
  letsencrypt:
  pb_data:
